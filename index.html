<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Caderno de técnicas avançadas de musculação: conta os blocos e o descanso do Muscle Round, Cluster e Rest-pause e diz se sobe, mantém ou baixa a carga.">
<meta name="theme-color" content="#fbfcf7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bloquinho">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:title" content="Bloquinho">
<meta property="og:description" content="Caderno de técnicas avançadas: Muscle Round, Cluster e Rest-pause.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Bloquinho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Permanent+Marker&display=swap">
<style>
/* Layout: one ruled spiral-notebook sheet, phone-first column (max 560px). The set screen is a single page: block strip, cue, giant post-it. */
:root{
  --paper:#fbfcf7; --card:#ffffff; --desk:#d8dde5; --rule:#c3d8ef; --margin:#f0959b; --wire:#8a92a2;
  --ink:#213f95; --marker:#1b1c21; --pencil:#646b7d;
  --hl-y:#fff25e; --hl-g:#aef07f; --hl-p:#ffa6d3; --under:#fff25e;
  --postit:#ffe66d; --fold:#e3c341; --on-hl:#1b1c21; --red:#cf2f3b; --tape:rgba(212,200,158,.62); --drop:#1b1c21; --ok:#2f9a4c;
  --f-display:"Permanent Marker","Marker Felt","Chalkboard SE","Comic Sans MS",cursive;
  --f-hand:"Kalam","Bradley Hand","Chalkboard SE","Segoe Print","Comic Sans MS",cursive;
  --line:32px; --mx:26px;
  --r1:255px 14px 225px 14px/14px 225px 14px 255px;
  --r2:14px 225px 14px 255px/255px 14px 225px 14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#16181e; --card:#1e2129; --desk:#0b0c10; --rule:#232d44; --margin:#5e2a33; --wire:#5d6475;
    --ink:#a8c3ff; --marker:#f0eee8; --pencil:#8f96a8;
    --hl-y:#eadc52; --hl-g:#8bd963; --hl-p:#f088c2; --under:rgba(234,220,82,.38);
    --postit:#e6d160; --fold:#b09c36; --on-hl:#15161b; --red:#ff6f78; --tape:rgba(255,255,255,.12); --drop:#000;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#16181e; --card:#1e2129; --desk:#0b0c10; --rule:#232d44; --margin:#5e2a33; --wire:#5d6475;
  --ink:#a8c3ff; --marker:#f0eee8; --pencil:#8f96a8;
  --hl-y:#eadc52; --hl-g:#8bd963; --hl-p:#f088c2; --under:rgba(234,220,82,.38);
  --postit:#e6d160; --fold:#b09c36; --on-hl:#15161b; --red:#ff6f78; --tape:rgba(255,255,255,.12); --drop:#000;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font:400 18px/1.42 var(--f-hand);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation;text-align:inherit}
:focus-visible{outline:2.5px dashed var(--ink);outline-offset:3px}
h1,h2,h3,p{margin:0}
.defs{position:absolute;width:0;height:0}

/* the notebook sheet */
.sheet{position:relative;max-width:560px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;
  padding-inline:calc(var(--mx) + 12px) 16px;padding-block:0 28px;
  background-color:var(--paper);
  background-image:
    linear-gradient(90deg,transparent var(--mx),var(--margin) var(--mx),var(--margin) calc(var(--mx) + 2px),transparent calc(var(--mx) + 2px)),
    repeating-linear-gradient(180deg,transparent 0 calc(var(--line) - 1px),var(--rule) calc(var(--line) - 1px) var(--line));
  box-shadow:0 12px 40px rgba(0,0,0,.18)}
.spiral{flex:0 0 auto;height:30px;margin-inline:calc(-1 * (var(--mx) + 12px)) -16px;
  background:
    linear-gradient(90deg,transparent 11px,var(--wire) 11px 15px,transparent 15px) 4px 0/26px 17px repeat-x,
    radial-gradient(circle at 13px 19px,var(--desk) 0 5.5px,transparent 6px) 4px 0/26px 30px repeat-x}
#app{flex:1;display:flex;flex-direction:column;min-width:0}

/* type */
.brand-row{display:flex;align-items:center;gap:14px}
.logo{width:56px;height:56px;flex:0 0 auto;border-radius:14px;box-shadow:2px 3px 0 var(--drop);transform:rotate(-4deg)}
.brand{font:400 2.7rem/1 var(--f-display);color:var(--marker);display:inline-block;transform:rotate(-2deg);transform-origin:left bottom;letter-spacing:.01em}
.scrib{display:block;width:210px;max-width:70%;height:12px;color:var(--red);margin-top:2px}
.scrib path{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round}
.tagline{color:var(--pencil);font-size:1.02rem;margin-top:4px}
.h2{font:400 1.32rem/1.2 var(--f-display);color:var(--marker);margin:26px 0 12px;text-wrap:balance}
.under{background:linear-gradient(100deg,transparent .1em,var(--under) .25em,var(--under) calc(100% - .25em),transparent calc(100% - .1em)) 0 92%/100% .45em no-repeat;padding-inline:.12em}
.ptitle{font:400 2rem/1.1 var(--f-display);color:var(--marker);text-wrap:balance;overflow-wrap:anywhere}
.psub{color:var(--pencil);margin-top:4px}
.lbl{display:block;font:700 .82rem/1.2 var(--f-hand);letter-spacing:.09em;text-transform:uppercase;color:var(--pencil);margin-bottom:6px}
.muted{color:var(--pencil)}
.mark{background:var(--c,var(--hl-y));color:var(--on-hl);padding:.02em .4em;border-radius:3px 9px 4px 10px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.tchip{display:inline-block;font:700 .7rem/1 var(--f-hand);letter-spacing:.08em;text-transform:uppercase;border:1.5px solid currentColor;border-radius:var(--r2);padding:.32em .55em .24em;color:var(--marker);white-space:nowrap;vertical-align:.12em}
.ic{width:1.1em;height:1.1em;flex:0 0 auto}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:50px;padding:.5rem 1.1rem;border:2px solid var(--marker);border-radius:var(--r1);background:var(--hl-y);color:var(--on-hl);font:700 1.12rem/1.1 var(--f-hand);box-shadow:3px 3px 0 var(--drop);transition:transform .06s,box-shadow .06s;text-align:center}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--drop)}
.btn.go{background:var(--hl-g)}
.btn.pink{background:var(--hl-p)}
.btn.ghost{background:transparent;color:var(--marker);border-style:dashed;box-shadow:none}
.btn.wide{width:100%}
.btn.xl{min-height:60px;font-size:1.3rem}
.link{color:var(--ink);font:700 1rem/1.2 var(--f-hand);text-decoration:underline wavy;text-decoration-thickness:1px;text-underline-offset:5px;padding:8px 2px}
.link.danger{color:var(--red)}
.armed{background:var(--hl-p)!important;color:var(--on-hl)!important;text-decoration:none!important;border-radius:6px;padding-inline:8px!important}
.field{width:100%;min-width:0;border:0;border-bottom:2px solid var(--marker);background:transparent;padding:4px 2px;font:400 1.15rem/1.3 var(--f-hand);color:var(--ink);border-radius:0}
.field.big{font:400 1.6rem/1.2 var(--f-display);color:var(--marker)}
.field::placeholder{color:var(--pencil);opacity:.7}
.field:focus{outline:none;border-bottom-color:var(--ink);background:linear-gradient(transparent 70%,var(--under) 70%)}

/* home */
.top{padding-block:16px 4px}
.how{position:relative;margin-top:20px;background:var(--card);border:2px solid var(--marker);border-radius:var(--r2);padding:18px 16px 8px;box-shadow:3px 4px 0 var(--drop);transform:rotate(.4deg)}
.how ol{margin:0;padding-left:1.3rem;display:flex;flex-direction:column;gap:6px}
.how li::marker{font-family:var(--f-display);color:var(--red)}
.how b{color:var(--marker)}
.tape{position:absolute;top:-12px;left:50%;width:86px;height:24px;margin-left:-43px;background:var(--tape);transform:rotate(-3deg);pointer-events:none}
.cards{display:flex;flex-direction:column;gap:22px;margin-top:6px}
.wcard{position:relative;display:flex;flex-direction:column;gap:8px;width:100%;background:var(--card);border:2px solid var(--marker);border-radius:var(--r1);padding:20px 16px 14px;box-shadow:3px 4px 0 var(--drop);transform:rotate(-.6deg);transition:transform .12s}
.wcard:nth-child(even){transform:rotate(.5deg);border-radius:var(--r2)}
.wcard:active{transform:translate(2px,2px) rotate(-.3deg);box-shadow:1px 2px 0 var(--drop)}
.wc-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.wc-name{font:400 1.5rem/1.1 var(--f-display);color:var(--marker);overflow-wrap:anywhere}
.ex-tag{font:700 .78rem/1 var(--f-hand);color:var(--red);border:1.5px dashed var(--red);border-radius:6px;padding:.25em .45em}
.wc-list{display:flex;flex-direction:column;gap:2px}
.wc-ex{display:flex;justify-content:space-between;align-items:baseline;gap:10px;color:var(--ink)}
.wc-ex>span:first-child{min-width:0;overflow-wrap:anywhere}
.wc-meta{color:var(--pencil);font-size:.92rem;border-top:1.5px dashed var(--rule);padding-top:6px}
.add-w{margin-top:20px}
.cola{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.cola-card{padding-block:2px}
.cola-card h3{font:400 1.08rem/1.2 var(--f-display);color:var(--marker);margin-bottom:4px}
.cola-card h3 .mark{display:inline-block;transform:rotate(-1.5deg)}
.cola-card p{font-size:.98rem}
.foot{margin-top:30px;display:flex;flex-direction:column;gap:10px;color:var(--pencil);font-size:.95rem}
.toggles{display:flex;flex-wrap:wrap;gap:6px 18px}
.tog{display:inline-flex;align-items:center;gap:8px;color:var(--ink);font:400 1rem var(--f-hand);padding:4px 0}
.box{width:22px;height:22px;border:2px solid var(--marker);border-radius:var(--r2);display:inline-grid;place-items:center;color:var(--red);flex:0 0 auto}
.box svg{width:20px;height:20px}
.sync{display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--pencil);flex:0 0 auto}
.dot.ok{background:var(--ok)}
.dot.warn{background:var(--red)}
.loading{margin-top:40px;font-size:1.2rem;color:var(--pencil)}

/* workout page */
.crumbs{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:8px 6px}
.go-next{margin-top:18px}
.alldone{margin-top:16px;font-size:1.15rem}
.exlist{list-style:none;margin:20px 0 0;padding:0;display:flex;flex-direction:column}
.ex{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:calc(var(--line) * 2.5);padding-block:6px}
.cb{width:24px;height:24px;border:2px solid var(--marker);border-radius:var(--r1);display:grid;place-items:center;color:var(--red)}
.cb svg{width:24px;height:24px;margin:-4px -2px 0 2px}
.ex-main{display:flex;flex-direction:column;gap:3px;min-width:0;padding-block:4px}
.ex-name{font:700 1.2rem/1.2 var(--f-hand);color:var(--marker);overflow-wrap:anywhere}
.ex.is-done .ex-name{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}
.ex.is-next .ex-name::after{content:"  ← próximo";font:400 .9rem var(--f-hand);color:var(--red)}
.ex-info{font-size:.92rem;color:var(--ink);display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.ex-hist{font-size:.9rem}
.empty{margin-top:18px}

/* editor */
.edlist{display:flex;flex-direction:column;gap:18px}
.ed{position:relative;background:var(--card);border:2px solid var(--marker);border-radius:var(--r2);padding:14px 14px 4px;display:flex;flex-direction:column;gap:12px;box-shadow:3px 3px 0 var(--drop)}
.ed:nth-child(even){border-radius:var(--r1)}
.ed-row{display:flex;align-items:baseline;gap:8px}
.ed-n{font:400 1.2rem var(--f-display);color:var(--red)}
.tech-pick{display:flex;flex-wrap:wrap;gap:8px}
.tp{border:2px dashed var(--pencil);border-radius:var(--r1);padding:6px 12px;font:700 .95rem/1.1 var(--f-hand);color:var(--ink)}
.tp.on{border-style:solid;border-color:var(--marker);background:var(--hl-y);color:var(--on-hl)}
.params{display:flex;flex-wrap:wrap;gap:10px 16px}
.num{display:flex;flex-direction:column;gap:2px;font-size:.85rem;color:var(--pencil)}
.num input{width:4.6rem;border:0;border-bottom:2px solid var(--marker);background:transparent;font:400 1.35rem/1.2 var(--f-display);color:var(--marker);padding:0 2px}
.ed-actions{display:flex;justify-content:space-between}
.ed-foot{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:22px}
.ed-add{margin-top:16px}

/* run screen */
.run{flex:1;display:flex;flex-direction:column;gap:12px;padding-top:4px}
.run-top{display:flex;align-items:center;gap:10px}
.run-top .tchip{margin-left:auto}
.icon-btn{width:44px;height:44px;border:2px solid var(--marker);border-radius:50%;display:grid;place-items:center;color:var(--marker);flex:0 0 auto}
.icon-btn svg{width:22px;height:22px}
.run-name{font:400 1.55rem/1.12 var(--f-display);color:var(--marker);overflow-wrap:anywhere;text-wrap:balance}
.run-name small{font:700 1.05rem var(--f-hand);color:var(--ink);white-space:nowrap}
.blocks{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px}
.cell{position:relative;height:60px;border:2px solid var(--marker);border-radius:var(--r2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:var(--card);padding-inline:3px;color:var(--ink)}
.cell:nth-child(odd){border-radius:var(--r1)}
.cell-n{font:700 .7rem/1 var(--f-hand);letter-spacing:.05em;color:var(--pencil);white-space:nowrap}
.cell.is-todo{border-style:dashed;border-color:var(--pencil);background:transparent}
.cell.is-fail{color:var(--red)}
.cell.is-next .cell-n{color:var(--red)}
.maxb{position:absolute;top:-10px;right:-4px;background:var(--paper);color:var(--red);font:700 .7rem/1 var(--f-hand);padding:2px 4px;border-radius:4px;transform:rotate(6deg)}
.circ{position:absolute;inset:-9px -7px;width:calc(100% + 14px);height:calc(100% + 18px);color:var(--red);pointer-events:none;animation:pop .25s ease-out}
.circ path{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round}
.t{width:100%;max-width:52px;height:24px}
.t path{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.t .g{opacity:.3}
.t .a{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .26s ease-out var(--d,0ms) forwards}
.q{font:400 1.2rem/1 var(--f-display);color:var(--red)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}

.stage{flex:1;display:flex;flex-direction:column;gap:12px}
.note{color:var(--pencil);font-size:.98rem}
.plan{position:relative;background:var(--card);border:2px solid var(--marker);border-radius:var(--r2);padding:16px 14px 12px;box-shadow:3px 3px 0 var(--drop);margin-top:8px}
.plan b{color:var(--marker)}
.load-row{display:flex;align-items:center;gap:6px}
.nb{flex:0 0 auto;min-width:46px;height:46px;padding:0 6px;border:2px solid var(--marker);border-radius:var(--r1);background:var(--card);color:var(--marker);font:700 1rem/1 var(--f-hand);text-align:center}
.nb:active{background:var(--hl-y);color:var(--on-hl)}
.load-in{flex:1;min-width:0;display:flex;align-items:baseline;justify-content:center;gap:4px;border-bottom:2.5px solid var(--marker)}
.load-in input{width:100%;min-width:0;text-align:center;border:0;background:transparent;font:400 2.3rem/1.15 var(--f-display);color:var(--marker);padding:0}
.load-in input:focus{outline:none}
.load-in:focus-within{background:linear-gradient(transparent 70%,var(--under) 70%)}
.load-in span{font:700 1rem var(--f-hand);color:var(--pencil)}
.hint{color:var(--pencil);font-size:.95rem;text-align:center}
.spacer{flex:1}

.cue{display:flex;align-items:baseline;justify-content:center;gap:.35rem;color:var(--marker);margin-top:2px}
.cue .k{font:700 .95rem var(--f-hand);letter-spacing:.14em;text-transform:uppercase;color:var(--pencil)}
.cue b{font:400 4rem/1 var(--f-display);font-weight:400}
.cue .of{font:400 1.5rem var(--f-display);color:var(--pencil)}
.cue-sub{text-align:center;font-size:1.25rem;color:var(--ink);margin-top:-6px}
.postit{position:relative;flex:1;min-height:200px;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px;
  background:linear-gradient(315deg,transparent 22px,var(--postit) 22px);color:var(--on-hl);transform:rotate(-1.1deg);
  filter:drop-shadow(0 10px 8px rgba(0,0,0,.18));transition:transform .08s ease-out}
.postit::after{content:"";position:absolute;right:0;bottom:0;width:31px;height:31px;background:linear-gradient(315deg,transparent 50%,var(--fold) 50%)}
.postit:active{transform:rotate(-1.1deg) scale(.97)}
.postit .big{font:400 2.1rem/1.05 var(--f-display);text-align:center;text-wrap:balance}
.postit .small{font:400 1.05rem var(--f-hand);opacity:.72}
.row2{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 16px}
.row2 .btn{flex:1 1 140px}

.timer{position:relative;width:min(74vw,290px);max-width:100%;aspect-ratio:1;margin:4px auto 0}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--rule);stroke-width:9}
.ring-fg{fill:none;stroke:var(--ink);stroke-width:9;stroke-linecap:round;filter:url(#rough)}
.timer b{position:absolute;inset:0;display:grid;place-items:center;font:400 6.2rem/1 var(--f-display);color:var(--marker);font-weight:400}
.timer.hot b{color:var(--red)}
.timer.hot .ring-fg{stroke:var(--red)}
.rest-sub{text-align:center;font-size:1.2rem}
.repadj{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}

.step{display:flex;align-items:center;gap:6px}
.step button{width:42px;height:42px;border:2px solid var(--marker);border-radius:50%;font:700 1.35rem/1 var(--f-hand);background:var(--card);color:var(--marker);display:grid;place-items:center}
.step button:active{background:var(--hl-y);color:var(--on-hl)}
.step output{min-width:2.2ch;text-align:center;font:400 1.6rem/1 var(--f-display);color:var(--marker)}

.done-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:4px}
.done-head .mark{font:400 1.45rem/1.2 var(--f-display)}
.total{font:400 1.45rem var(--f-display);color:var(--marker)}
.rrows{display:flex;flex-direction:column}
.rrow{display:grid;grid-template-columns:2.4rem minmax(0,1fr) auto 28px;align-items:center;gap:8px;min-height:var(--line);padding-block:3px}
.rrow .rn{font:400 1.05rem var(--f-display);color:var(--pencil)}
.rrow .rt{color:var(--ink);display:flex;align-items:center;gap:8px;min-width:0}
.rrow .rt .t{max-width:64px}
.rrow.fail .rt{color:var(--red)}
.rrow.ask .rt::after{content:"← quantas?";font-size:.9rem;color:var(--red);white-space:nowrap}
.xbtn{width:28px;height:28px;border-radius:50%;color:var(--red);font:700 1.2rem/1 var(--f-hand);display:grid;place-items:center}
.addb{align-self:flex-start}
.stamp{position:relative;border:2.5px solid var(--marker);border-radius:var(--r2);padding:14px 16px;background:var(--card);box-shadow:3px 4px 0 var(--drop);transform:rotate(-.6deg);margin-top:6px}
.stamp h3{display:inline-block;font:400 1.5rem/1.15 var(--f-display);color:var(--on-hl);background:var(--c);padding:.08em .45em;transform:rotate(-2deg);margin-bottom:8px;border-radius:3px 10px 4px 12px}
.stamp p{color:var(--ink)}
.stamp .cmp{color:var(--pencil);font-size:.95rem;margin-top:6px}
.done-actions{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:6px}

/* history */
.chart{margin-top:18px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .ln{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;filter:url(#rough)}
.chart .pt{fill:var(--paper);stroke:var(--ink);stroke-width:2.5}
.chart .pt.up{fill:var(--hl-g)} .chart .pt.keep{fill:var(--hl-y)} .chart .pt.down{fill:var(--hl-p)}
.chart .v{font:400 14px var(--f-display);fill:var(--marker);text-anchor:middle}
.chart .kg{font:700 11px var(--f-hand);fill:var(--pencil);text-anchor:middle}
.chart figcaption{font-size:.9rem;color:var(--pencil);margin-top:4px}
.tbl{margin-top:18px;overflow-x:auto}
.logt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.logt th{font:700 .74rem/1.2 var(--f-hand);letter-spacing:.08em;text-transform:uppercase;color:var(--pencil);text-align:left;padding:4px 6px 6px;white-space:nowrap}
.logt td{padding:4px 6px;height:var(--line);vertical-align:middle;white-space:nowrap}
.logt td.kg{font:400 1.05rem var(--f-display);color:var(--marker)}
.logt td.bl{color:var(--ink);font-size:.95rem}
.logt .del{color:var(--pencil);font:700 1.1rem var(--f-hand);padding:2px 8px}

/* bottom sheet + toast */
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(10,12,20,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.bsheet{width:100%;max-width:520px;background:var(--card);border:2px solid var(--marker);border-radius:var(--r1);padding:20px 16px 10px;box-shadow:4px 5px 0 var(--drop);display:flex;flex-direction:column;gap:14px;animation:up .2s ease-out}
.bsheet h2{font:400 1.35rem/1.2 var(--f-display);color:var(--marker);text-wrap:balance}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:12px}
.pick{aspect-ratio:1;max-width:100%;border:2px solid var(--marker);border-radius:50%;font:400 2rem/1 var(--f-display);background:var(--hl-p);color:var(--on-hl);box-shadow:2px 3px 0 var(--drop)}
.pick:active{transform:translate(2px,2px);box-shadow:none}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.bsheet.install{max-height:calc(100dvh - 32px);overflow-y:auto}
.ihead{display:flex;align-items:center;gap:14px}
.ihead .logo{width:52px;height:52px}
.isteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.isteps li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center}
.isteps b{color:var(--marker)}
.ibadge{width:44px;height:44px;border:2px solid var(--marker);border-radius:var(--r1);display:grid;place-items:center;background:var(--hl-y);color:var(--on-hl)}
.ibadge svg{width:24px;height:24px}
.itip{font-size:.95rem;color:var(--pencil)}
.iurl{font:400 1.3rem/1.2 var(--f-display);color:var(--marker);overflow-wrap:anywhere;user-select:all}
.install-btn{margin-top:4px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;transform:translate(-50%,30px) rotate(-1deg);opacity:0;pointer-events:none;background:var(--postit);color:var(--on-hl);font:700 1.05rem var(--f-hand);padding:10px 18px;box-shadow:0 8px 14px rgba(0,0,0,.2);transition:opacity .2s,transform .2s;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0) rotate(-1deg)}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .t .a{stroke-dashoffset:0}
}
@media (min-width:600px){
  .sheet{margin-block:24px;min-height:calc(100% - 48px)}
  :root{--mx:40px}
}
</style>
</head>
<body>
<svg class="defs" aria-hidden="true" focusable="false"><defs>
  <filter id="rough" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3.5"/></filter>
</defs></svg>

<div class="sheet">
  <div class="spiral" aria-hidden="true"></div>
  <main id="app"></main>
</div>
<div id="sheetLayer"></div>
<div id="installLayer"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ---------- técnicas ---------- */
const zone = c => Math.max(1, Math.ceil(c.blocks / 2));
const TECH = {
  muscle: {
    name: 'Muscle Round', mode: 'fixed', lastMax: true, blocks: 6, reps: 4, rest: 10, goal: 20, color: '--hl-y',
    rule: c => `${c.blocks} blocos de ${c.reps} reps com ${c.rest} s de descanso. Carga de 8 a 12 reps. O ideal é falhar entre o ${zone(c)}º e o ${zone(c) + 1}º bloco. Chegou no ${c.blocks}º? Vai até a falha.`,
    first: 'escolhe uma carga que você faria de 8 a 12 reps direto'
  },
  cluster: {
    name: 'Cluster set', mode: 'fixed', lastMax: false, blocks: 5, reps: 3, rest: 20, goal: 20, color: '--hl-g',
    rule: c => `${c.blocks} blocos de ${c.reps} reps com ${c.rest} s de descanso. Carga pesada, de umas 5 a 6 reps. Fechou todos os blocos? Sobe a carga.`,
    first: 'escolhe uma carga que você faria umas 5 ou 6 reps direto'
  },
  restpause: {
    name: 'Rest-pause', mode: 'count', lastMax: false, blocks: 3, reps: 0, rest: 15, goal: 20, color: '--hl-p',
    rule: c => `Vai até a falha, descansa ${c.rest} s e continua, ${c.blocks} blocos no total. Anota as reps de cada um. Somou ${c.goal} reps? Sobe a carga.`,
    first: 'escolhe uma carga que você faria de 8 a 10 reps direto'
  }
};
const LIMITS = { blocks: [2, 10], reps: [1, 20], rest: [3, 180], goal: [3, 200] };

/* ---------- utils ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const newId = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const clean = o => JSON.parse(JSON.stringify(o));
const dayKey = (d = new Date()) => d.toLocaleDateString('sv-SE');
const fmt = n => n == null || n === '' ? '—' : Number(n).toLocaleString('pt-BR', { maximumFractionDigits: 1 });
const fmtDate = ts => new Date(ts).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
const fmtLong = d => d.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
const parseNum = v => { const n = parseFloat(String(v).replace(',', '.')); return Number.isFinite(n) && n >= 0 ? Math.round(n * 10) / 10 : null; };
const rand = k => { const x = Math.sin(k * 12.9898) * 43758.5453; return x - Math.floor(x); };

/* ---------- estado ---------- */
const LS = 'bloquinho:v1', LS_RUN = 'bloquinho:run';
const S = { workouts: [], logs: [], settings: { sound: true, voice: true, hideHow: false }, seeded: false };
const sync = { db: null, uid: null, mode: 'local', dirty: false, dels: [] };
let view = { name: 'home' };
let run = null;
let booting = true;
let armed = null, armedAt = 0, armedTimer = null;
let focusAfter = null;

function mkEx(name, tech = 'muscle') {
  const T = TECH[tech];
  return { id: newId(), name, tech, blocks: T.blocks, reps: T.reps || 4, rest: T.rest, goal: T.goal };
}
function exampleWorkout() {
  return { id: newId(), name: 'Treino A', example: true, exercises: [
    mkEx('Supino inclinado com halteres'), mkEx('Puxada frontal'), mkEx('Cadeira extensora'), mkEx('Elevação lateral')
  ] };
}
const getW = id => S.workouts.find(w => w.id === id);
const getE = (wid, eid) => getW(wid)?.exercises.find(e => e.id === eid);
const logsOf = eid => S.logs.filter(l => l.eid === eid);
const lastLog = eid => logsOf(eid).at(-1);
const cfgOf = e => { const T = TECH[e.tech]; return { tech: e.tech, mode: T.mode, lastMax: T.lastMax, blocks: e.blocks, reps: e.reps || 4, rest: e.rest, goal: e.goal || T.goal }; };
const sortLogs = () => S.logs.sort((a, b) => a.ts - b.ts);

/* ---------- lógica de progressão ---------- */
function stepLoad(load, pct, dir) {
  const min = load >= 10 ? 1 : 0.5;
  let x = load * (1 + dir * pct);
  x = x >= 20 ? Math.round(x) : Math.round(x * 2) / 2;
  return dir > 0 ? Math.max(x, load + min) : Math.max(0, Math.min(x, load - min));
}
function evaluate(cfg, reps, load) {
  const total = reps.reduce((a, b) => a + (+b || 0), 0);
  const ev = { total, verdict: 'keep', failBlock: null, next: load ?? null, big: false };
  if (cfg.mode === 'count') {
    ev.verdict = total >= cfg.goal ? 'up' : 'keep';
  } else {
    let fi = reps.findIndex(r => r < cfg.reps);
    if (fi === -1 && reps.length < cfg.blocks) fi = reps.length;
    if (fi === -1) {
      ev.verdict = 'up';
      ev.big = cfg.lastMax && (reps.at(-1) || 0) >= cfg.reps * 2;
    } else {
      ev.failBlock = fi + 1;
      ev.verdict = ev.failBlock < zone(cfg) ? 'down' : 'keep';
    }
  }
  if (load) {
    if (ev.verdict === 'up') ev.next = stepLoad(load, ev.big ? 0.10 : 0.05, 1);
    if (ev.verdict === 'down') ev.next = stepLoad(load, 0.10, -1);
  }
  return ev;
}
const VCOLOR = { up: 'var(--hl-g)', keep: 'var(--hl-y)', down: 'var(--hl-p)' };
const VWORD = { up: 'sobe', keep: 'mantém', down: 'baixa' };
function verdictCopy(cfg, ev, reps) {
  const kg = ev.next != null ? `${fmt(ev.next)} kg` : null;
  const z = zone(cfg);
  if (cfg.mode === 'count') {
    if (ev.verdict === 'up') return { title: 'Sobe a carga', body: `Somou ${ev.total} reps e bateu a meta de ${cfg.goal}.${kg ? ` Próximo treino: ${kg}.` : ''}` };
    return { title: 'Mantém a carga', body: `Somou ${ev.total} de ${cfg.goal} reps. Mesma carga no próximo treino, tenta somar mais.` };
  }
  if (ev.verdict === 'up') {
    const lastTxt = cfg.lastMax ? ` e fez ${reps.at(-1)} reps no último` : '';
    const bigTxt = ev.big ? ' Sobrou gás, dá pra subir mais.' : '';
    return { title: 'Sobe a carga', body: `Fechou os ${cfg.blocks} blocos${lastTxt}.${bigTxt}${kg ? ` Próximo treino: ${kg}.` : ''}` };
  }
  if (ev.verdict === 'down') {
    return { title: 'Baixa a carga', body: `Falhou já no ${ev.failBlock}º bloco. O alvo é falhar entre o ${z}º e o ${z + 1}º.${kg ? ` Próximo treino: uns ${kg}.` : ''}` };
  }
  let zoneTxt = '';
  if (ev.failBlock === z || ev.failBlock === z + 1) zoneTxt = ' Tá na zona certa.';
  else if (ev.failBlock > z + 1) zoneTxt = ' Tá quase fechando tudo.';
  const goal = ev.failBlock < cfg.blocks ? `passar do ${ev.failBlock}º bloco` : `fechar o ${cfg.blocks}º bloco`;
  return { title: 'Mantém a carga', body: `Falhou no ${ev.failBlock}º bloco.${zoneTxt} Mesma carga no próximo treino, tenta ${goal}.` };
}
function planFor(e) {
  const last = lastLog(e.id), T = TECH[e.tech];
  if (!last) return { load: null, html: `Primeira vez nesse exercício: ${T.first}.` };
  const when = fmtDate(last.ts);
  if (last.verdict === 'up') return { load: last.next ?? last.load, html: `Em ${when} você fechou tudo com ${fmt(last.load)} kg. <b>Hoje: ${fmt(last.next ?? last.load)} kg.</b>` };
  if (last.verdict === 'down') return { load: last.next ?? last.load, html: `Em ${when} ficou pesado com ${fmt(last.load)} kg. <b>Hoje: uns ${fmt(last.next ?? last.load)} kg.</b>` };
  if (last.cfg?.mode === 'count') return { load: last.load, html: `Em ${when}: ${last.total} reps com ${fmt(last.load)} kg. <b>Hoje: mesma carga, tenta ${last.total + 1} ou mais.</b>` };
  return { load: last.load, html: `Em ${when} você falhou no ${last.failBlock}º bloco com ${fmt(last.load)} kg (${last.total} reps). <b>Hoje: mesma carga, tenta passar do ${last.failBlock}º.</b>` };
}

/* ---------- persistência ---------- */
function lsLoad() {
  try {
    const d = JSON.parse(localStorage.getItem(LS) || 'null');
    if (!d) return;
    S.workouts = d.workouts || []; S.logs = d.logs || [];
    S.settings = { ...S.settings, ...(d.settings || {}) }; S.seeded = !!d.seeded;
    sync.dirty = !!d.dirty; sync.dels = d.dels || [];
    sortLogs();
  } catch (e) {}
}
function lsSave() {
  try { localStorage.setItem(LS, JSON.stringify({ workouts: S.workouts, logs: S.logs, settings: S.settings, seeded: S.seeded, dirty: sync.dirty, dels: sync.dels })); } catch (e) {}
}
const hasData = () => S.seeded || S.logs.length > 0;
const cadRef = () => sync.db.doc(`data/users/${sync.uid}/caderno`);

let pushTimer = null, pushChain = Promise.resolve();
function schedulePush(ms = 0) {
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => { pushChain = pushChain.then(pushPending); }, ms);
}
async function pushPending() {
  if (!sync.db || !sync.uid) return;
  try {
    if (sync.dirty) {
      sync.dirty = false;
      try { await cadRef().set(clean({ v: 1, workouts: S.workouts, settings: S.settings, updatedAt: Date.now() })); }
      catch (e) { sync.dirty = true; throw e; }
    }
    for (const l of S.logs.filter(l => !l.synced)) {
      const { synced, ...body } = l;
      await cadRef().collection('logs').doc(l.id).set(clean(body));
      l.synced = true;
    }
    while (sync.dels.length) {
      await cadRef().collection('logs').doc(sync.dels[0]).delete();
      sync.dels.shift();
    }
    setSync('cloud');
  } catch (e) {
    setSync('offline');
  }
  lsSave();
}
function setSync(mode) {
  if (sync.mode === mode) return;
  sync.mode = mode;
  const el = $('#syncLine'); if (el) el.outerHTML = syncLine();
}
function saveCaderno() {
  S.seeded = true; sync.dirty = true; lsSave(); schedulePush(500);
}
function addLog(l) {
  S.logs.push({ ...l, synced: false }); sortLogs(); lsSave(); schedulePush(0);
}
function deleteLog(id) {
  const l = S.logs.find(x => x.id === id); if (!l) return;
  S.logs = S.logs.filter(x => x.id !== id);
  if (l.synced) sync.dels.push(id);
  lsSave(); schedulePush(0);
}
async function cloudInit() {
  if (!window.claude || typeof window.claude.use !== 'function') return;
  let db = null, user = null;
  try { [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch (e) { return; }
  if (!db || !user) return;
  let uid = null;
  try { uid = await user.id(); } catch (e) {}
  if (!uid) return;
  sync.db = db; sync.uid = uid;
  try {
    const ref = cadRef();
    const [cad, snap] = await Promise.all([ref.get(), ref.collection('logs').get()]);
    if (cad.exists && !sync.dirty) {
      const d = cad.data() || {};
      S.workouts = clean(d.workouts || []);
      S.settings = { ...S.settings, ...(d.settings || {}) };
      S.seeded = true;
    }
    const map = new Map();
    for (const doc of snap.docs) { const d = doc.data(); if (d && d.id) map.set(d.id, { ...clean(d), synced: true }); }
    for (const l of S.logs) if (!l.synced && !map.has(l.id)) map.set(l.id, l);
    for (const id of sync.dels) map.delete(id);
    S.logs = [...map.values()]; sortLogs();
    sync.mode = 'cloud';
    lsSave();
    await pushPending();
  } catch (e) {
    sync.mode = 'offline';
  }
}

/* ---------- som, voz, tela ---------- */
let actx = null, ptVoice = null, speechPrimed = false, wake = null;
function audioUnlock() {
  try {
    if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
    if (actx && actx.state === 'suspended') actx.resume();
  } catch (e) {}
  try {
    if (!speechPrimed && 'speechSynthesis' in window) { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); speechPrimed = true; }
  } catch (e) {}
}
function beep(freq = 880, dur = 0.12, vol = 0.22) {
  if (!S.settings.sound || !actx) return;
  try {
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.03);
  } catch (e) {}
}
function pickVoice() {
  try { const vs = speechSynthesis.getVoices(); ptVoice = vs.find(v => /^pt[-_]BR/i.test(v.lang)) || vs.find(v => /^pt/i.test(v.lang)) || null; } catch (e) {}
}
if ('speechSynthesis' in window) { pickVoice(); try { speechSynthesis.addEventListener('voiceschanged', pickVoice); } catch (e) {} }
function say(text, delay = 0) {
  if (!S.settings.voice || !('speechSynthesis' in window)) return;
  setTimeout(() => {
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'pt-BR'; if (ptVoice) u.voice = ptVoice; u.rate = 1.08;
      speechSynthesis.speak(u);
    } catch (e) {}
  }, delay);
}
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
function cue(kind, n, last) {
  if (kind === 'start') { beep(880, 0.14); say(last ? 'Bloco único. Vai!' : 'Bloco 1. Vai!', 150); }
  if (kind === 'rest') { beep(520, 0.09, 0.16); }
  if (kind === 'count') { beep(760, 0.08); }
  if (kind === 'go') { beep(1180, 0.3, 0.28); buzz([180, 80, 180]); say(last ? 'Último bloco! Até a falha!' : `Bloco ${n}. Vai!`, 330); }
  if (kind === 'done') { beep(880, 0.12); setTimeout(() => beep(1320, 0.22), 150); buzz(300); say('Fim da série.', 420); }
}
async function requestWake() {
  try { if ('wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) {}
}
function releaseWake() { try { wake && wake.release(); } catch (e) {} wake = null; }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && view.name === 'run' && run && (run.phase === 'work' || run.phase === 'rest')) { requestWake(); tick(); }
});

/* ---------- série em andamento ---------- */
function saveRunDraft() { try { run && localStorage.setItem(LS_RUN, JSON.stringify({ ...run, ask: null, savedAt: Date.now() })); } catch (e) {} }
function clearRunDraft() { try { localStorage.removeItem(LS_RUN); } catch (e) {} }
function restoreRun() {
  try {
    const d = JSON.parse(localStorage.getItem(LS_RUN) || 'null');
    if (!d || Date.now() - d.savedAt > 3 * 3600e3 || d.phase === 'ready' || !getE(d.wid, d.eid)) { clearRunDraft(); return; }
    run = { ...d, animIdx: -1 };
    if (run.phase === 'rest' && Date.now() >= run.restEnd) run.phase = 'work';
    view = { name: 'run' };
  } catch (e) {}
}
const curEx = () => run && getE(run.wid, run.eid);
function setPhase(p) { run.phase = p; run.phaseAt = Date.now(); }
function defaultCount(i) {
  const prev = lastLog(run.eid);
  if (prev && prev.reps && prev.reps[i] != null) return prev.reps[i];
  return i === 0 ? 10 : Math.max(1, (run.reps[i - 1] || 4) - 3);
}

let tickT = null;
const RING = 2 * Math.PI * 84;
function startTick() { stopTick(); tickT = setInterval(tick, 100); tick(); }
function stopTick() { if (tickT) { clearInterval(tickT); tickT = null; } }
function tick() {
  if (!run || run.phase !== 'rest') { stopTick(); return; }
  const ms = run.restEnd - Date.now();
  if (ms <= 0) { endRest(); return; }
  const sec = Math.ceil(ms / 1000);
  const c = $('#count'); if (c && c.textContent !== String(sec)) c.textContent = sec;
  const t = $('#timer'); if (t) t.classList.toggle('hot', sec <= 3);
  const r = $('#ringFg'); if (r) r.style.strokeDashoffset = (RING * (1 - ms / run.restMs)).toFixed(1);
  if (sec !== run.lastSec) { if (run.lastSec != null && sec <= 3) cue('count'); run.lastSec = sec; }
}
function startRest() {
  const cfg = cfgOf(curEx());
  setPhase('rest');
  run.restMs = cfg.rest * 1000; run.restEnd = Date.now() + run.restMs; run.lastSec = null;
  cue('rest'); saveRunDraft(); render(); startTick();
}
function endRest() {
  stopTick();
  const cfg = cfgOf(curEx()); const n = run.reps.length + 1;
  setPhase('work');
  cue('go', n, n === cfg.blocks && (cfg.lastMax || cfg.mode === 'count'));
  saveRunDraft(); render();
}
function finish() {
  stopTick(); setPhase('done'); run.ask = null;
  cue('done'); saveRunDraft(); render(); window.scrollTo(0, 0);
}
function pushBlock(v) { run.reps.push(v); run.animIdx = run.reps.length - 1; }

/* ---------- ícones ---------- */
const ICON = {
  play: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5 19 12 7 19.5Z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>',
  check: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12.5 9 18.5 21 3.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  sound: on => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 9.5h3.6L12 5.4v13.2l-4.9-4.1H3.5z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>${on
    ? '<path d="M15.4 9c1.3 1.7 1.3 4.3 0 6M18.2 6.3c2.6 3.2 2.6 8.2 0 11.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'

function tally(n, ghost = 0, seed = 1, anim = false) {
  const total = n + ghost;
  if (!total) return '<svg class="t" viewBox="0 0 30 26" aria-hidden="true"></svg>';
  const groups = Math.ceil(total / 5), W = Math.max(30, groups * 30 - 4);
  let s = '';
  for (let i = 0; i < total; i++) {
    const g = Math.floor(i / 5), p = i % 5, solid = i < n;
    const j = k => (rand(seed * 31 + i * 7 + k) * 2 - 1);
    const cls = solid ? (anim ? 's a' : 's') : 'g';
    const st = solid && anim ? ` style="--d:${i * 70}ms"` : '';
    const d = p < 4
      ? `M${(4 + g * 30 + p * 6.2 + j(1) * 0.8).toFixed(1)} ${(3.5 + j(2)).toFixed(1)}L${(4 + g * 30 + p * 6.2 + j(3) * 1.4).toFixed(1)} ${(22.5 + j(4)).toFixed(1)}`
      : `M${g * 30 + 0.5} ${(18 + j(5)).toFixed(1)}L${g * 30 + 25.5} ${(7 + j(6)).toFixed(1)}`;
    s += `<path class="${cls}"${st} pathLength="1" d="${d}"/>`;
  }
  return `<svg class="t" viewBox="0 0 ${W} 26" aria-hidden="true">${s}</svg>`;
}

function blockStrip(cfg) {
  const n = cfg.blocks, cur = run.reps.length;
  let cells = '';
  for (let i = 0; i < n; i++) {
    const r = run.reps[i];
    const label = `B${i + 1}`;
    let cls = 'is-todo', inner = '', extra = i === n - 1 && cfg.lastMax ? '<span class="maxb">máx</span>' : '';
    if (r != null) {
      const failed = cfg.mode === 'fixed' && r < cfg.reps;
      cls = failed ? 'is-fail' : 'is-done';
      inner = tally(r, failed ? cfg.reps - r : 0, i + 1, i === run.animIdx);
    } else if (i === cur && run.phase === 'work') {
      cls = 'is-cur';
      inner = cfg.mode === 'fixed' ? tally(0, cfg.reps, i + 1) : '<span class="q">?</span>';
      extra += ICON.circle;
    } else {
      if (i === cur && run.phase === 'rest') cls += ' is-next';
      inner = cfg.mode === 'fixed' && run.phase === 'ready' ? tally(0, cfg.reps, i + 1) : '';
    }
    cells += `<div class="cell ${cls}"><span class="cell-n">${label}</span>${inner}${extra}</div>`;
  }

}

function stageWork(cfg) {
  const i = run.reps.length, isLast = i === cfg.blocks - 1;

  if (cfg.mode === 'fixed' && !lastMax) secondary.push(`<button class="btn pink" data-a="fail">Falhei antes de ${cfg.reps}</button>`);
  if (cfg.mode === 'count' && i > 0) secondary.push(`<button class="btn ghost" data-a="end-set">Encerrar aqui</button>`);
  if (i > 0) secondary.push(`<button class="link" data-a="undo">desfazer bloco ${i}</button>`);
  return `

function stageRest(cfg) {

  const done = run.reps.length - 1;
  return `
    <div class="timer${sec <= 3 ? ' hot' : ''}" id="timer" role="timer" aria-label="descanso">
      <svg viewBox="0 0 200 200" aria-hidden="true"><circle class="ring-bg" cx="100" cy="100" r="84"/><circle class="ring-fg" id="ringFg" cx="100" cy="100" r="84" stroke-dasharray="${RING.toFixed(1)}" style="stroke-dashoffset:${(RING * (1 - ms / run.restMs)).toFixed(1)}"/></svg>
      <b id="count">${sec}</b>
    </div>
    <p class="rest-sub">descansa… <span class="muted">próximo: bloco ${nextI + 1}${nextLast ? ', o último' : ''}</span></p>

function stepper(i) {
  return `<div class="step"><button data-a="rep" data-i="${i}" data-d="-1" aria-label="menos uma rep no bloco ${i + 1}">−</button><output>${run.reps[i]}</output><button data-a="rep" data-i="${i}" data-d="1" aria-label="mais uma rep no bloco ${i + 1}">+</button></div>`;
}
function stageDone(e, cfg) {
  const ev = evaluate(cfg, run.reps, run.load);
  const vc = verdictCopy(cfg, ev, run.reps);
  const prev = lastLog(e.id);
  let cmp = '';
  if (prev) {
    if (prev.load === run.load) {
      const d = ev.total - prev.total;
      cmp = d > 0 ? `+${d} reps em relação a ${fmtDate(prev.ts)} com a mesma carga.` : d < 0 ? `${d} reps em relação a ${fmtDate(prev.ts)} com a mesma carga.` : `Mesmas reps de ${fmtDate(prev.ts)}.`;
    } else cmp = `Em ${fmtDate(prev.ts)}: ${fmt(prev.load)} kg · ${prev.total} reps.`;
  }
  const askLast = cfg.lastMax || cfg.mode === 'count';
  const rows = run.reps.map((r, i) => {
    const failed = cfg.mode === 'fixed' && r < cfg.reps;
    const ask = askLast && i === run.reps.length - 1 && (cfg.mode === 'count' || i === cfg.blocks - 1);
    return `<div class="rrow${failed ? ' fail' : ''}${ask ? ' ask' : ''}">
      <span class="rn">B${i + 1}</span>
      <span class="rt">${tally(r, 0, i + 1)}</span>
      ${stepper(i)}
      ${i === run.reps.length - 1 && run.reps.length > 1 ? `<button class="xbtn" data-a="rm-block" aria-label="remover bloco ${i + 1}">×</button>` : '<span></span>'}
    </div>`;
  }).join('');
  return `
    <div class="done-head"><span class="mark" style="--c:var(--hl-g)">Fim da série!</span><span class="total">${ev.total} reps</span></div>
    <div>
      <span class="lbl">Confere as reps de cada bloco</span>
      <div class="rrows">${rows}</div>
      ${run.reps.length < cfg.blocks && (cfg.mode === 'count' || ev.failBlock == null || ev.failBlock > run.reps.length) ? `<button class="link addb" data-a="add-block">+ esqueci de marcar um bloco</button>` : ''}
    </div>
    <div class="stamp" style="--c:${VCOLOR[ev.verdict]}"><h3>${vc.title}</h3><p>${vc.body}</p>${cmp ? `<p class="cmp">${cmp}</p>` : ''}</div>
    <div class="done-actions">
      <button class="btn go wide xl" data-a="save">Anotar no caderno</button>
      <button class="link danger" data-a="discard">descartar esta série</button>
    </div>`;
}
function viewAsk() {
  const cfg = cfgOf(curEx()); const i = run.reps.length;
  return `<div class="backdrop" data-a="ask-close">
    <div class="bsheet" role="dialog" aria-modal="true" aria-labelledby="askT" data-a="noop">
      <h2 id="askT">Quantas reps saíram no bloco ${i + 1}?</h2>
      <div class="picks">${Array.from({ length: cfg.reps }, (_, k) => `<button class="pick" data-a="fail-pick" data-v="${k}">${k}</button>`).join('')}</div>
      <button class="link" data-a="ask-close">voltar, ainda não falhei</button>
    </div>
  </div>`;
}
function viewHistory() {
  const w = getW(view.wid), e = getE(view.wid, view.eid);
  if (!e) { view = { name: 'workout', wid: view.wid }; return viewWorkout(); }
  const logs = logsOf(e.id);
  const rows = logs.slice().reverse().map(l => `<tr>
    <td>${fmtDate(l.ts)}</td>
    <td class="kg">${fmt(l.load)}</td>
    <td class="bl">${l.reps.join(' · ')}</td>
    <td>${l.total}</td>
    <td>${vmini(l.verdict)}</td>
    <td><button class="del" data-a="del-log" data-l="${l.id}" aria-label="apagar registro de ${fmtDate(l.ts)}">×</button></td>
  </tr>`).join('');
  return `
  <nav class="crumbs"><button class="link" data-a="open-w" data-w="${w.id}">← ${esc(w.name || 'treino')}</button></nav>
  <h1 class="ptitle">${esc(e.name || 'Exercício')}</h1>
  <p class="psub"><span class="tchip">${TECH[e.tech].name}</span> · ${logs.length} registro${logs.length === 1 ? '' : 's'}</p>
  ${logs.length >= 2 ? chart(logs) : ''}
  ${logs.length ? `<div class="tbl"><table class="logt">
    <thead><tr><th>data</th><th>kg</th><th>reps por bloco</th><th>total</th><th>próx.</th><th aria-label="apagar"></th></tr></thead>
    <tbody>${rows}</tbody></table></div>`
    : `<p class="empty muted">Ainda não tem nada anotado aqui. Faz uma série e ela aparece nesta página.</p>`}
  <div style="margin-top:22px"><button class="btn go wide" data-a="run" data-e="${e.id}">${ICON.play}<span>Fazer agora</span></button></div>`;
}
function chart(all) {
  const L = all.slice(-10), W = 340, H = 170, pl = 20, pr = 20, pt = 30, pb = 40;
  const vals = L.map(l => l.total), max = Math.max(...vals), min = Math.min(...vals), span = Math.max(1, max - min);
  const x = i => L.length === 1 ? W / 2 : pl + i * (W - pl - pr) / (L.length - 1);
  const y = v => pt + (1 - (v - min) / span) * (H - pt - pb);
  const d = L.map((l, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(l.total).toFixed(1)}`).join('');
  const pts = L.map((l, i) => `<circle class="pt ${l.verdict}" cx="${x(i).toFixed(1)}" cy="${y(l.total).toFixed(1)}" r="5.5"/>
    <text class="v" x="${x(i).toFixed(1)}" y="${(y(l.total) - 12).toFixed(1)}">${l.total}</text>
    <text class="kg" x="${x(i).toFixed(1)}" y="${H - 20}">${fmt(l.load)}kg</text>
    <text class="kg" x="${x(i).toFixed(1)}" y="${H - 6}">${fmtDate(l.ts)}</text>`).join('');
  return `<figure class="chart" style="margin-inline:0">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Total de reps nos últimos ${L.length} treinos">
      <path class="ln" d="${d}"/>${pts}
    </svg>
    <figcaption>Total de reps por treino. A cor da bolinha é o veredito: verde sobe, amarelo mantém, rosa baixa.</figcaption>
  </figure>`;
}

/* ---------- render ---------- */
function render() {
  const app = $('#app');
  let html;
  switch (view.name) {
    case 'workout': html = viewWorkout(); break;
    case 'run': html = run ? viewRun() : (view = { name: 'home' }, viewHome()); break;
    case 'history': html = viewHistory(); break;
    default: html = viewHome();
  }
  app.innerHTML = html;
  $('#sheetLayer').innerHTML = view.name === 'run' && run && run.ask ? viewAsk() : '';
  if (run) run.animIdx = -1;
  if (view.name === 'run' && run && run.phase === 'rest' && !tickT) startTick();
  if (focusAfter) { const el = document.getElementById(focusAfter); focusAfter = null; if (el) { el.focus(); el.select && el.select(); } }
}
function go(v) { view = v; armed = null; window.scrollTo(0, 0); render(); }
function confirmTap(el, key, label) {
  if (armed === key && Date.now() - armedAt < 3500) { armed = null; clearTimeout(armedTimer); return true; }
  armed = key; armedAt = Date.now();
  el.textContent = label; el.classList.add('armed');
  clearTimeout(armedTimer);
  armedTimer = setTimeout(() => { if (armed === key) { armed = null; render(); } }, 3500);
  return false;
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2400);
}
function touchWorkout(w) { if (w && w.example) w.example = false; }

/* ---------- ações ---------- */
const ACT = {
  noop() {},
  install() { openInstall(); },
  'install-close'() { closeInstall(); },
  async 'install-go'() {
    if (!deferredPrompt) return;
    const p = deferredPrompt; deferredPrompt = null;
    try { p.prompt(); const r = await p.userChoice; if (r && r.outcome === 'accepted') { closeInstall(); return; } } catch (e) {}
    renderInstall();
  },
  home() { go({ name: 'home' }); },
  'hide-how'() { S.settings.hideHow = true; saveCaderno(); render(); },
  set(el) { const k = el.dataset.k; S.settings[k] = !S.settings[k]; saveCaderno(); render(); },
  'open-w'(el) { go({ name: 'workout', wid: el.dataset.w }); },
  'new-w'() {
    const w = { id: newId(), name: '', exercises: [mkEx('')] };
    S.workouts.push(w); saveCaderno(); focusAfter = 'wname';
    go({ name: 'workout', wid: w.id, edit: true });
  },
  'edit-w'() { view.edit = true; render(); },
  'edit-done'() { view.edit = false; go(view); },
  'ex-tech'(el) {
    const w = getW(view.wid), e = getE(view.wid, el.dataset.e), T = TECH[el.dataset.t];
    if (!e || e.tech === el.dataset.t) return;
    Object.assign(e, { tech: el.dataset.t, blocks: T.blocks, reps: T.reps || 4, rest: T.rest, goal: T.goal });
    touchWorkout(w); saveCaderno(); render();
  },
  'ex-up'(el) {
    const w = getW(view.wid), i = w.exercises.findIndex(e => e.id === el.dataset.e);
    if (i > 0) { [w.exercises[i - 1], w.exercises[i]] = [w.exercises[i], w.exercises[i - 1]]; touchWorkout(w); saveCaderno(); render(); }
  },
  'ex-del'(el) {
    if (!confirmTap(el, 'ex-del:' + el.dataset.e, 'apagar mesmo?')) return;
    const w = getW(view.wid); w.exercises = w.exercises.filter(e => e.id !== el.dataset.e);
    touchWorkout(w); saveCaderno(); render();
  },
  'ex-add'() {
    const w = getW(view.wid), e = mkEx('');
    w.exercises.push(e); touchWorkout(w); saveCaderno(); focusAfter = 'exn-' + e.id; render();
  },
  'w-del'(el) {
    if (!confirmTap(el, 'w-del', 'apagar o treino inteiro?')) return;
    S.workouts = S.workouts.filter(w => w.id !== view.wid); saveCaderno(); go({ name: 'home' }); toast('Treino apagado.');
  },
  run(el) {
    const wid = view.wid, e = getE(wid, el.dataset.e); if (!e) return;
    run = { wid, eid: e.id, phase: 'ready', phaseAt: Date.now(), load: planFor(e).load, reps: [], animIdx: -1 };
    go({ name: 'run', wid });
  },
  hist(el) { go({ name: 'history', wid: view.wid, eid: el.dataset.e }); },
  load(el) {
    const inp = $('#loadIn'); const cur = parseNum(inp ? inp.value : run.load) ?? 0;
    run.load = Math.max(0, Math.round((cur + parseFloat(el.dataset.d)) * 10) / 10);
    render();
  },
  begin() {
    const inp = $('#loadIn'); if (inp) run.load = parseNum(inp.value);
    audioUnlock(); requestWake();
    const cfg = cfgOf(curEx());
    run.reps = []; setPhase('work');
    cue('start', 1, cfg.blocks === 1);
    saveRunDraft(); render(); window.scrollTo(0, 0);
  },
  'block-done'() {
    if (!run || run.phase !== 'work' || Date.now() - run.phaseAt < 400) return;
    audioUnlock();
    const cfg = cfgOf(curEx()), i = run.reps.length, isLast = i === cfg.blocks - 1;
    if (cfg.mode === 'count') { pushBlock(defaultCount(i)); if (isLast) finish(); else startRest(); return; }
    pushBlock(cfg.reps);
    if (isLast) finish(); else startRest();
  },
  fail() { run.ask = 'fail'; render(); },
  'fail-pick'(el) { pushBlock(parseInt(el.dataset.v, 10)); run.ask = null; finish(); },
  'ask-close'() { run.ask = null; render(); },
  'end-set'() { finish(); },
  undo() {
    stopTick(); run.reps.pop(); setPhase('work'); saveRunDraft(); render();
  },
  skip() { endRest(); },
  rep(el) {
    const i = +el.dataset.i; run.reps[i] = clamp((run.reps[i] || 0) + (+el.dataset.d), 0, 99); saveRunDraft(); render();
  },
  'rm-block'() { if (run.reps.length > 1) { run.reps.pop(); saveRunDraft(); render(); } },
  'add-block'() {
    const cfg = cfgOf(curEx());
    if (run.reps.length < cfg.blocks) { run.reps.push(cfg.mode === 'fixed' ? cfg.reps : (run.reps.at(-1) || 1)); saveRunDraft(); render(); }
  },
  save() {
    const e = curEx(), w = getW(run.wid), cfg = cfgOf(e), ev = evaluate(cfg, run.reps, run.load);
    addLog({ id: newId(), ts: Date.now(), day: dayKey(), wid: run.wid, eid: e.id, name: e.name, tech: e.tech, cfg,
      load: run.load, reps: run.reps.slice(), total: ev.total, verdict: ev.verdict, failBlock: ev.failBlock, next: ev.next });
    if (w.example || !S.seeded) { touchWorkout(w); saveCaderno(); }
    const wid = run.wid; run = null; clearRunDraft(); releaseWake();
    go({ name: 'workout', wid }); toast('Anotado no caderno.');
  },
  discard(el) {
    if (!confirmTap(el, 'discard', 'toca de novo pra descartar')) return;
    const wid = run.wid; run = null; clearRunDraft(); releaseWake(); go({ name: 'workout', wid });
  },
  'run-exit'(el) {
    if (run && run.reps.length && run.phase !== 'ready') { if (!confirmTap(el, 'exit', 'sair sem anotar?')) return; }
    stopTick(); const wid = run ? run.wid : view.wid; run = null; clearRunDraft(); releaseWake(); go({ name: 'workout', wid });
  },
  mute() {
    const on = S.settings.sound || S.settings.voice;
    S.settings.sound = S.settings.voice = !on;
    if (on) { try { speechSynthesis.cancel(); } catch (e) {} } else audioUnlock();
    saveCaderno(); render();
  },
  'del-log'(el) {
    if (!confirmTap(el, 'del:' + el.dataset.l, 'apagar?')) return;
    deleteLog(el.dataset.l); render(); toast('Registro apagado.');
  }
};
const INP = {
  'w-name'(el) { const w = getW(view.wid); if (!w) return; w.name = el.value; touchWorkout(w); saveCaderno(); },
  'ex-name'(el) { const w = getW(view.wid), e = getE(view.wid, el.dataset.e); if (!e) return; e.name = el.value; touchWorkout(w); saveCaderno(); },
  load(el) { if (run) { run.load = parseNum(el.value); saveRunDraft(); } }
};
const CHG = {
  'ex-num'(el) {
    const w = getW(view.wid), e = getE(view.wid, el.dataset.e), k = el.dataset.k; if (!e) return;
    const v = parseInt(el.value, 10);
    e[k] = clamp(Number.isFinite(v) ? v : e[k], LIMITS[k][0], LIMITS[k][1]);
    el.value = e[k]; touchWorkout(w); saveCaderno();
  }
};
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]'); if (!el) return;
  const fn = ACT[el.dataset.a]; if (fn) fn(el, ev);
});
document.addEventListener('input', ev => { const el = ev.target.closest('[data-in]'); if (el && INP[el.dataset.in]) INP[el.dataset.in](el); });
document.addEventListener('change', ev => { const el = ev.target.closest('[data-in]'); if (el && CHG[el.dataset.in]) CHG[el.dataset.in](el); });
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.matches && ev.target.matches('input')) ev.target.blur();
  if (ev.key === 'Escape' && installOpen) { closeInstall(); return; }
  if (ev.key === 'Escape' && run && run.ask) { run.ask = null; render(); }
});

/* ---------- boot ---------- */
lsLoad();
restoreRun();
render();
function settleBoot(force) {
  if (!booting && !force) return;
  booting = false;
  if (!S.workouts.length && !S.seeded) S.workouts = [exampleWorkout()];
  render();
}
cloudInit().finally(() => settleBoot(true));
setTimeout(() => settleBoot(false), 2500);

let seenInstall = false;
try { seenInstall = !!localStorage.getItem(LS_INSTALL); } catch (e) {}
if (!isStandalone() && (isIOS || isAndroid) && !seenInstall && !run) setTimeout(openInstall, 900);
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').catch(() => {}); });
}
try { if (isStandalone() && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
})();
</script>
</body>
</html>
